<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head(${titulo})}"></head>
<body>
<svg th:replace="~{fragments::icones}"></svg>
<aside th:replace="~{fragments::sidebar}"></aside>
<main>
<header th:replace="~{fragments::barra}"></header>
    <div class="top">
        <div>
                        <h1 th:text="${titulo}"></h1>
            <p class="muted">Contato, origem e orçamento do cliente.</p>
        </div>
    </div>
    <section class="panel form-panel">
        <form th:action="${acao}" method="post" th:object="${form}">
            <div th:replace="~{fragments::errosDoFormulario}"></div>
            <div class="fields">
                <div class="field">
                    <label for="nome">Nome do cliente</label>
                    <input id="nome" type="text" autocomplete="name" placeholder="Nome completo" th:field="*{nome}" required maxlength="120" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('nome')},aria-describedby=${#fields.hasErrors('nome') ? 'erro-nome' : null}">
                    <p class="error-text" id="erro-nome" role="alert" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
                </div>
                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" type="tel" autocomplete="tel" placeholder="(17) 99999-9999" th:field="*{telefone}" required maxlength="30" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('telefone')},aria-describedby=${#fields.hasErrors('telefone') ? 'erro-telefone' : null}">
                    <p class="muted help">Informe DDD e número. Exemplo: (17) 99999-9999.</p>
                    <p class="error-text" id="erro-telefone" role="alert" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></p>
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" th:field="*{email}" maxlength="180" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'erro-email' : null}">
                    <p class="error-text" id="erro-email" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div class="field">
                    <label for="origem">Origem</label>
                    <select id="origem" th:field="*{origem}" required th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('origem')},aria-describedby=${#fields.hasErrors('origem') ? 'erro-origem' : null}">
                        <option value="">Selecione</option>
                        <option th:each="op:${origens}" th:value="${op.name()}" th:text="${op.descricao}"></option>
                    </select>
                    <p class="error-text" id="erro-origem" role="alert" th:if="${#fields.hasErrors('origem')}" th:errors="*{origem}"></p>
                </div>
                <div class="field">
                    <label for="orcamento">Orçamento (R$)</label>
                    <input id="orcamento" type="number" th:field="*{orcamento}" required min="0" step="0.01" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('orcamento')},aria-describedby=${#fields.hasErrors('orcamento') ? 'erro-orcamento' : null}">
                    <p class="error-text" id="erro-orcamento" role="alert" th:if="${#fields.hasErrors('orcamento')}" th:errors="*{orcamento}"></p>
                </div>
<div class="field" th:if="${admin}"><label for="responsavelId">Corretor responsável</label><select id="responsavelId" th:field="*{responsavelId}" required th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('responsavelId')},aria-describedby=${#fields.hasErrors('responsavelId') ? 'erro-responsavelId' : null}"><option th:each="op:${responsaveis}" th:value="${op.id}" th:text="${op.nome}"></option></select></div>
                <div class="field full">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" placeholder="Observações sobre o atendimento" th:field="*{observacoes}" maxlength="2000" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('observacoes')},aria-describedby=${#fields.hasErrors('observacoes') ? 'erro-observacoes' : null}"></textarea>
                    <p class="error-text" id="erro-observacoes" role="alert" th:if="${#fields.hasErrors('observacoes')}" th:errors="*{observacoes}"></p>
                </div>
            </div>
            <div class="formfooter">
                <button class="btn">Salvar cliente</button>
                <a class="btn secondary" th:href="@{/leads}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
