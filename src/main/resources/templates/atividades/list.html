<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head('Atividades')}"></head>
<body>
<svg th:replace="~{fragments::icones}"></svg>
<aside th:replace="~{fragments::sidebar}"></aside>
<main>
<header th:replace="~{fragments::barra}"></header>
    <div class="top">
        <div><h1>Atividades <span class="page-count" th:text="${#lists.size(registros)}"></span></h1><p class="muted">Prazos e próximos passos dos seus atendimentos.</p></div>
        <a class="btn" th:href="@{/atividades/novo}"><svg th:replace="~{fragments::icone('mais')}"></svg>Nova atividade</a>
    </div>
    <p th:replace="~{fragments::salvo}"></p>
    <div class="tablewrap" tabindex="0" role="region" aria-label="Lista de atividades">
        <table>
            <thead>
                <tr>
                    <th scope="col">Atividade</th>
                    <th scope="col">Cliente</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Prazo</th>
                    <th scope="col">Conclusão</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r:${registros}">
                    <td th:text="${r.titulo}"></td>
                    <td><a th:href="@{/leads/{id}(id=${r.lead.id})}" th:text="${r.lead.nome}"></a></td>
                    <td th:text="${r.tipo.descricao}"></td>
                    <td th:text="${#temporals.format(r.prazo,'dd/MM/yyyy HH:mm')}"></td>
                    <td th:with="encerrado=${r.lead.etapa.name() == 'GANHO' or r.lead.etapa.name() == 'PERDIDO'}"><span class="tag" th:attr="data-status=${r.concluidaEm != null ? 'CONCLUIDA' : (encerrado ? 'ENCERRADA' : 'PENDENTE')}" th:text="${r.concluidaEm != null ? 'Concluída' : (encerrado ? 'Não concluída' : 'Pendente')}"></span></td>
                    <td class="actions">
                        <th:block th:if="${r.lead.etapa.name() != 'GANHO' and r.lead.etapa.name() != 'PERDIDO'}">
                            <a class="btn secondary small" th:href="@{/atividades/{id}/editar(id=${r.id})}">Editar</a>
                            <form th:action="@{/atividades/{id}/excluir(id=${r.id})}" method="post" data-confirm="Excluir esta atividade?">
                                <button class="danger">Excluir</button>
                            </form>
                        </th:block>
                        <span class="muted" th:unless="${r.lead.etapa.name() != 'GANHO' and r.lead.etapa.name() != 'PERDIDO'}">Consulta</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(registros)}">
                    <td class="empty" colspan="6">Nenhuma atividade cadastrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
