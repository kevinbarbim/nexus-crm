<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments::head(${titulo})}"></head>
<body>
<svg th:replace="~{fragments::icones}"></svg>
<aside th:replace="~{fragments::sidebar}"></aside>
<main>
<header th:replace="~{fragments::barra}"></header>
    <div class="top">
        <div>
                        <h1 th:text="${titulo}"></h1>
            <p class="muted">Cliente, próximo contato e prazo.</p>
        </div>
    </div>
    <section class="panel form-panel">
        <form th:action="${acao}" method="post" th:object="${form}">
            <div th:replace="~{fragments::errosDoFormulario}"></div>
            <div class="fields">
                <div class="field">
                    <label for="leadId">Cliente</label>
                    <select id="leadId" th:field="*{leadId}" required th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('leadId')},aria-describedby=${#fields.hasErrors('leadId') ? 'erro-leadId' : null}">
                        <option value="">Selecione</option>
                        <option th:each="op:${leads}" th:value="${op.id}" th:text="${op.nome}"></option>
                    </select>
                    <p class="error-text" id="erro-leadId" role="alert" th:if="${#fields.hasErrors('leadId')}" th:errors="*{leadId}"></p>
                </div>
                <div class="field">
                    <label for="titulo">Título da atividade</label>
                    <input id="titulo" type="text" placeholder="Ex.: Retornar contato com o cliente" th:field="*{titulo}" required maxlength="160" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('titulo')},aria-describedby=${#fields.hasErrors('titulo') ? 'erro-titulo' : null}">
                    <p class="error-text" id="erro-titulo" role="alert" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></p>
                </div>
                <div class="field">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" th:field="*{tipo}" required th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('tipo')},aria-describedby=${#fields.hasErrors('tipo') ? 'erro-tipo' : null}">
                        <option value="">Selecione</option>
                        <option th:each="op:${tipos}" th:value="${op.name()}" th:text="${op.descricao}"></option>
                    </select>
                    <p class="error-text" id="erro-tipo" role="alert" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></p>
                </div>
                <div class="field">
                    <label for="prazo">Prazo</label>
                    <input id="prazo" type="datetime-local" th:field="*{prazo}" required th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('prazo')},aria-describedby=${#fields.hasErrors('prazo') ? 'erro-prazo' : null}">
                    <p class="error-text" id="erro-prazo" role="alert" th:if="${#fields.hasErrors('prazo')}" th:errors="*{prazo}"></p>
                </div>
                <div class="field check-field">
                    <label for="concluida">Atividade concluída</label>
                    <input id="concluida" type="checkbox" th:field="*{concluida}"  th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('concluida')},aria-describedby=${#fields.hasErrors('concluida') ? 'erro-concluida' : null}">
                    <p class="error-text" id="erro-concluida" role="alert" th:if="${#fields.hasErrors('concluida')}" th:errors="*{concluida}"></p>
                </div>
                <div class="field full">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" placeholder="Observações sobre o atendimento" th:field="*{observacoes}" maxlength="2000" th:errorclass="invalid" th:attr="aria-invalid=${#fields.hasErrors('observacoes')},aria-describedby=${#fields.hasErrors('observacoes') ? 'erro-observacoes' : null}"></textarea>
                    <p class="error-text" id="erro-observacoes" role="alert" th:if="${#fields.hasErrors('observacoes')}" th:errors="*{observacoes}"></p>
                </div>
            </div>
            <div class="formfooter">
                <button class="btn">Salvar atividade</button>
                <a class="btn secondary" th:href="@{/atividades}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
