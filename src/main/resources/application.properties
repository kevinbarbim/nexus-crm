spring.config.import=optional:file:./smtp.local.properties
spring.application.name=Nexus
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=NexoImob;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.thymeleaf.cache=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail-from=${MAIL_FROM:${SPRING_MAIL_USERNAME:noreply@nexus.local}}
app.bootstrap-email=${ADMIN_EMAIL:}
app.bootstrap-password=${ADMIN_PASSWORD:}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
